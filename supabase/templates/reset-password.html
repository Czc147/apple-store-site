<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:Arial,sans-serif;color:#1d1d1f;line-height:1.7;padding:24px">
  <h1 style="font-size:22px">重置你的登录密码</h1>
  <p>我们收到了你的 Zorvin 密码重置请求。请回到网站的重置密码页面，输入以下验证码：</p>
  <p style="font-size:30px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
  <p>验证通过后，你可以设置新密码。请勿向任何人提供此验证码。</p>
  <p>如果验证码已失效，请在网站重新获取。如果不是你本人操作，请忽略此邮件。</p>
</body></html>
